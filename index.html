<script>
    // =========================================================================
    // 1. حماية وتجميد اختصارات أدوات الفحص (DevTools) والنقر الأيمن
    // =========================================================================

    // منع زر الفأرة الأيمن (Context Menu)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // منع اختصارات لوحة المفاتيح المتعلقة بالفحص
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === "F12" || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            return false;
        }

        // Ctrl+U (عرض سورس الصفحة)
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
            e.preventDefault();
            return false;
        }
    });

    // =========================================================================
    // 2. إدارة الواجهات والنافذة المنبثقة
    // =========================================================================
    let currentSelectedApp = "";

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function showSection(sectionId) {
        document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (sectionId === 'homeSection') document.getElementById('navHome').classList.add('active');
        if (sectionId === 'aboutSection') document.getElementById('navAbout').classList.add('active');
        if (sectionId === 'downloadSection') document.getElementById('navDownload').classList.add('active');

        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCodeModal(appName) {
        currentSelectedApp = appName;
        document.getElementById('modalAppName').innerText = "تحميل " + appName;
        document.getElementById('codeModal').classList.add('active');
        document.getElementById('certCodeInput').value = "";
        document.getElementById('alertMsg').className = "alert-msg";
        document.getElementById('alertMsg').innerText = "";
    }

    function closeCodeModal() {
        document.getElementById('codeModal').classList.remove('active');
    }

    // =========================================================================
    // 3. التحقق من الكود عبر خادم Cloudflare Worker الخاص بك
    // =========================================================================
    async function validateAndDownload() {
        const inputVal = document.getElementById('certCodeInput').value.trim().toUpperCase();
        const alertMsg = document.getElementById('alertMsg');

        if (!inputVal) {
            alertMsg.innerText = "يرجى إدخال الكود أولاً!";
            alertMsg.className = "alert-msg error";
            return;
        }

        alertMsg.innerText = "جاري التحقق من الكود...";
        alertMsg.className = "alert-msg";

        try {
            // رابط خادم Cloudflare الخاص بك
            const WORKER_URL = "https://ufuq.followorfollow1.workers.dev/";

            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    app: currentSelectedApp,
                    code: inputVal
                })
            });

            const data = await response.json();

            if (data.success) {
                alertMsg.innerText = "تم التحقق بنجاح! جاري التوجيه للتحميل...";
                alertMsg.className = "alert-msg success";

                setTimeout(() => {
                    window.location.href = data.link;
                    closeCodeModal();
                }, 1000);
            } else {
                alertMsg.innerText = "عذراً، كود الشهادة غير صحيح أو غير مفعّل!";
                alertMsg.className = "alert-msg error";
            }
        } catch (error) {
            alertMsg.innerText = "حدث خطأ أثناء الاتصال بخادم التحقق!";
            alertMsg.className = "alert-msg error";
        }
    }
</script>
